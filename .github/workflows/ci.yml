name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest==9.2.0 httpx==0.28.1 ruff==0.17.5
      - name: Lint
        run: ruff check .
      - name: Artifact validation (metadata, metrics, CV config, threshold, experiment log)
        run: python -m training.validate_artifact
      - name: Tests (API, data science, leakage, performance)
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000/ | grep -q "Churn Risk Dashboard"
          curl -fsS -X POST http://localhost:3000/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"Yes","Dependents":"No","tenure":2,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":95.5,"TotalCharges":190.0}' \
            | grep -q riskTier
          curl -fsS http://localhost:8000/api/v1/metrics | grep -q '"predictions":1'
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  release:
    # Push a tag like v1.0.0 to publish versioned images to GitHub Container Registry.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t $IMAGE-api:$GITHUB_REF_NAME -t $IMAGE-api:latest .
          docker build -t $IMAGE-web:$GITHUB_REF_NAME -t $IMAGE-web:latest frontend
          docker push --all-tags $IMAGE-api
          docker push --all-tags $IMAGE-web
