name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest==9.2.0 httpx==0.28.1 ruff==0.17.5
      - name: Lint
        run: ruff check .
      - name: Tests (API, data science, leakage)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000/ | grep -q "Churn Risk Dashboard"
          curl -fsS -X POST http://localhost:3000/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"Yes","Dependents":"No","tenure":2,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":95.5,"TotalCharges":190.0}' \
            | grep -q riskTier
      - name: Logs on failure
        if: failure()
        run: docker compose logs
