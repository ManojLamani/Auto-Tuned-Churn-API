services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      # Trust X-Forwarded-For from the web container so rate limits apply per real client.
      FORWARDED_ALLOW_IPS: 172.16.0.0/12

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
